<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">WebDAV backup: a server cylinder receiving stacked snapshots</title>
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- stacked snapshots going up into the store -->
  <rect x="10" y="38" width="26" height="6" rx="2.5" fill="currentColor" fill-opacity="0.28"/>
  <rect x="10" y="28" width="26" height="6" rx="2.5" fill="currentColor" fill-opacity="0.42"/>
  <rect x="10" y="18" width="26" height="6" rx="2.5" fill="currentColor" fill-opacity="0.58"/>

  <!-- arrow into the cylinder -->
  <path d="M38 28 H44" stroke="currentColor" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M41 24 L45.5 28 L41 32" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- WebDAV store cylinder -->
  <ellipse cx="53" cy="24" rx="8" ry="3.4" fill="url(#cloud)"/>
  <path d="M45 24 V42 A8 3.4 0 0 0 61 42 V24" fill="none" stroke="currentColor" stroke-opacity="0.72" stroke-width="2.4"/>
  <path d="M45 33 A8 3.4 0 0 0 61 33" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-width="2"/>
</svg>
